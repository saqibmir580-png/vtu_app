name: Development Android Build

on:
  push:
    branches:
      - develop

jobs:
  quality_gates:
    name: Code Quality & Type Check
    steps:
      - name: Checkout Code
        uses: eas/checkout

      - name: Install Dependencies
        uses: eas/install_node_modules

      - name: Run CI Validation & Configuration Gate
        run: npm test

      - name: TypeScript Compilation Gate
        run: npm run tsc

  build_development_android:
    name: Build Development Client APK
    needs: [quality_gates]
    type: build
    params:
      platform: android
      profile: development
