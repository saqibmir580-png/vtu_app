name: Testing & QA Android Build

on:
  push:
    branches:
      - staging

jobs:
  quality_gates:
    name: Code Quality & Type Check
    steps:
      - name: Checkout Code
        uses: eas/checkout

      - name: Install Dependencies
        uses: eas/install_node_modules

      - name: Run CI Validation & Environment Isolation Gate
        run: npm test

      - name: TypeScript Compilation Gate
        run: npm run tsc

  build_preview_apk:
    name: Build QA Staging APK
    needs: [quality_gates]
    type: build
    params:
      platform: android
      profile: preview
